plugins {
	id 'fabric-loom'
	id 'com.gradleup.shadow'
	id 'maven-publish'
}

base { archivesName = rootProject.archives_base_name }

repositories {
	mavenCentral()
	exclusiveContent {
		forRepository {
			maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' }
		}
		filter { includeGroup 'maven.modrinth' }
	}
}

configurations { shadowBundle }

ext.fabricCompatibilityLane = '1.20.1'

def compatibilityLane = project.findProperty('fabricCompatibilityLane') ?: '1.20.4'
def compatibilityMinecraft = compatibilityLane == '1.20.1' ? rootProject.minecraft_1_20_1_version : rootProject.minecraft_1_20_4_version
def compatibilityLoader = compatibilityLane == '1.20.1' ? rootProject.loader_1_20_1_version : rootProject.loader_1_20_4_version
def compatibilityFabric = compatibilityLane == '1.20.1' ? rootProject.fabric_1_20_1_version : rootProject.fabric_1_20_4_version
def compatibilityModMenu = compatibilityLane == '1.20.1' ? rootProject.modmenu_1_20_1_version : rootProject.modmenu_1_20_4_version
def compatibilityVivecraft = compatibilityLane == '1.20.1' ? rootProject.vivecraft_1_20_1_version : rootProject.vivecraft_1_20_4_version
def compatibilityMcngProject = ":mcng-fabric-client-${compatibilityLane}"

def compatibilityMainSourceDir = file("${buildDir}/generated/compatibility-main")
def versionMainSourceDir = file('src/main/java')
def versionMainPaths = fileTree(versionMainSourceDir).matching { include '**/*.java' }.files.collect { sourceFile ->
	versionMainSourceDir.toPath().relativize(sourceFile.toPath()).toString().replace('\\', '/')
}.toSet()
def generateCompatibilityMainSources = tasks.register('generateCompatibilityMainSources') {
	dependsOn project(':fabric-1.21.1').tasks.named('generateCompatibilityMainSources')
	def sourceRoot = rootProject.file('clients/fabric/1.21.1/build/generated/compatibility-main')
	inputs.dir(sourceRoot)
	outputs.dir(compatibilityMainSourceDir)
	doLast {
		project.delete(compatibilityMainSourceDir)
		fileTree(sourceRoot).matching { include '**/*.java'; exclude versionMainPaths }.files.each { sourceFile ->
			def relativePath = sourceRoot.toPath().relativize(sourceFile.toPath()).toString().replace('\\', '/')
			def sourceText = sourceFile.getText('UTF-8').replace('ResourceLocation.fromNamespaceAndPath(', 'new ResourceLocation(')
				sourceText = sourceText.replaceAll('(?m)^\\s*ServerLifecycleEvents\\.BEFORE_SAVE\\.register\\([^;]+;\\s*\\R', '')
			sourceText = sourceText.replace('ServerPlayNetworking.registerGlobalReceiver(VideoPayload.ID, (p, c) -> {', 'ServerPlayNetworking.registerGlobalReceiver(VideoPayload.ID, (p, player, sender) -> {')
			sourceText = sourceText.replace('c.player()', 'player').replace('c.server()', 'player.getServer()')
			def targetFile = new File(compatibilityMainSourceDir, relativePath)
			targetFile.parentFile.mkdirs()
			targetFile.setText(sourceText, 'UTF-8')
		}
	}
}

def versionClientSourceDir = file('src/client/java')
versionClientSourceDir.mkdirs()
def versionClientPaths = fileTree(versionClientSourceDir).matching { include '**/*.java' }.files.collect { sourceFile ->
	versionClientSourceDir.toPath().relativize(sourceFile.toPath()).toString().replace('\\', '/')
}.toSet()
def compatibilityClientSourceDir = file("${buildDir}/generated/compatibility-client")
def generateCompatibilityClientSources = tasks.register('generateCompatibilityClientSources') {
	dependsOn project(':fabric-1.21.1').tasks.named('generateCompatibilityClientSources')
	def sourceRoots = [
		rootProject.file('clients/fabric/1.21.1/build/generated/compatibility-client'),
		rootProject.file('clients/fabric/1.21.1/src/client/java')
	]
	inputs.files(sourceRoots)
	inputs.dir(versionClientSourceDir)
	outputs.dir(compatibilityClientSourceDir)
	doLast {
		project.delete(compatibilityClientSourceDir)
			sourceRoots.each { sourceRoot ->
			fileTree(sourceRoot).matching { include '**/*.java'; exclude versionClientPaths }.files.each { sourceFile ->
				def relativePath = sourceRoot.toPath().relativize(sourceFile.toPath()).toString().replace('\\', '/')
				def sourceText = sourceFile.getText('UTF-8').replace('ResourceLocation.fromNamespaceAndPath(', 'new ResourceLocation(')
				if (relativePath == 'com/github/squi2rel/vp/ScreenRenderer.java') {
					def layerVariants = [
						'return RenderType.entityTranslucent(texture);',
						'return RenderType.eyes(texture);',
						'return RenderType.entityTranslucentEmissive(texture, false);',
						'return UnlitVideoRenderType.get(texture);'
					]
					def releaseTexture = 'runOnClientThread(() -> Minecraft.getInstance().getTextureManager().release(textureIdentifier(registration)));'
					def clearLayers = '''runOnClientThread(() -> {
            for (ExternalTextureRegistry.Registration registration : registrations) {'''
					if (!layerVariants.any { sourceText.contains(it) }) {
						throw new GradleException('Unable to adapt the 1.20.1 unlit video render layer')
					}
					layerVariants.each { litLayer ->
						sourceText = sourceText.replace(litLayer, 'return UnlitVideoRenderType.get(texture);')
					}
					if (sourceText.contains(releaseTexture)) {
						sourceText = sourceText.replace(releaseTexture, '''runOnClientThread(() -> {
            ResourceLocation identifier = textureIdentifier(registration);
            UnlitVideoRenderType.release(identifier);
            Minecraft.getInstance().getTextureManager().release(identifier);
        });''')
					} else if (!sourceText.contains('UnlitVideoRenderType.release(identifier);')) {
						throw new GradleException('Unable to adapt the 1.20.1 unlit video render layer release path')
					}
					if (sourceText.contains(clearLayers)) {
						sourceText = sourceText.replace(clearLayers, '''runOnClientThread(() -> {
            UnlitVideoRenderType.clear();
            for (ExternalTextureRegistry.Registration registration : registrations) {''')
					} else if (!sourceText.contains('UnlitVideoRenderType.clear();')) {
						throw new GradleException('Unable to adapt the 1.20.1 unlit video render layer cleanup path')
					}
				}
				sourceText = sourceText.replace('ClientPlayNetworking.registerGlobalReceiver(VideoPayload.ID, (p, c) -> {', 'ClientPlayNetworking.registerGlobalReceiver(VideoPayload.ID, (p, player, sender) -> {')
				sourceText = sourceText.replace('import net.minecraft.core.component.DataComponents;\n', '')
				sourceText = sourceText.replace('import net.minecraft.world.item.component.CustomModelData;\n', '')
				sourceText = sourceText.replace('import net.minecraft.client.DeltaTracker;\n', '')
				sourceText = sourceText.replace('private void videoplayer$postUpdate(DeltaTracker tickCounter, CallbackInfo ci)', 'private void videoplayer$postUpdate(CallbackInfo ci)')
				sourceText = sourceText.replace('DeltaTracker tickCounter', 'float tickCounter')
				sourceText = sourceText.replace('client.getTimer().getGameTimeDeltaPartialTick(true)', 'client.getFrameTime()')
				sourceText = sourceText.replace('VideoPlayerClient.client.getTimer().getGameTimeDeltaPartialTick(true)', 'VideoPlayerClient.client.getFrameTime()')
				sourceText = sourceText.replace('client.gameRenderer.renderLevel(client.getTimer())', 'client.gameRenderer.renderLevel(client.getFrameTime(), client.getFrameTimeNs(), new com.mojang.blaze3d.vertex.PoseStack())')
				sourceText = sourceText.replace('CustomModelData data = item.getComponents().get(DataComponents.CUSTOM_MODEL_DATA);\n            if (data == null) continue;\n            if (data.value() != Math.round(remoteControlId)) continue;', 'if (item.getTag() == null || item.getTag().getInt("CustomModelData") != Math.round(remoteControlId)) continue;')
				sourceText = sourceText.replace('.setUv(point.u, point.v);', '.setUv(point.u, point.v).setOverlay(net.minecraft.client.renderer.texture.OverlayTexture.NO_OVERLAY).setLight(0x00F000F0).setNormal(0.0f, 1.0f, 0.0f);')
				sourceText = sourceText.replaceAll('(?ms)(^\\s*(?:consumer|buffer)\\.addVertex\\([^;]+?);', '$1.endVertex();')
				sourceText = sourceText.replace('.addVertex(', '.vertex(')
				sourceText = sourceText.replace('.setColor(', '.color(')
				sourceText = sourceText.replace('.setUv(', '.uv(')
				sourceText = sourceText.replace('.setOverlay(', '.overlayCoords(')
				sourceText = sourceText.replace('.setLight(', '.uv2(')
				sourceText = sourceText.replace('.setNormal(', '.normal(')
				sourceText = sourceText.replace('.setLineWidth(1.0f)', '')
				sourceText = sourceText.replace('addVertex(', 'vertex(')
				sourceText = sourceText.replace('setUv1(', 'overlayCoords(')
				sourceText = sourceText.replace('setUv2(', 'uv2(')
				sourceText = sourceText.replace('setColor(', 'color(')
				sourceText = sourceText.replace('setUv(', 'uv(')
				sourceText = sourceText.replace('setOverlay(', 'overlayCoords(')
				sourceText = sourceText.replace('setLight(', 'uv2(')
				sourceText = sourceText.replace('setNormal(', 'normal(')
				sourceText = sourceText.replace('public VertexConsumer vertex(float x, float y, float z) {', 'public VertexConsumer vertex(double x, double y, double z) {')
				sourceText = sourceText.replace('this.x = x;\n            this.y = y;\n            this.z = z;', 'this.x = (float) x;\n            this.y = (float) y;\n            this.z = (float) z;')
				sourceText = sourceText.replace('this.x = x;', 'this.x = (float) x;')
				sourceText = sourceText.replace('this.y = y;', 'this.y = (float) y;')
				sourceText = sourceText.replace('this.z = z;', 'this.z = (float) z;')
				sourceText = sourceText.replaceAll('(?s)\\s*@Override\\s+public VertexConsumer setLineWidth\\(float width\\) \\{.*?\\n\\s*\\}', '')
				sourceText = sourceText.replace('Tesselator.getInstance().begin(', 'Tesselator.getInstance().getBuilder(); buffer.begin(')
				sourceText = sourceText.replace('BufferUploader.drawWithShader(buffer.buildOrThrow())', 'BufferUploader.drawWithShader(buffer.end())')
				sourceText = sourceText.replace('import net.minecraft.client.renderer.rendertype.RenderType;', 'import net.minecraft.client.renderer.RenderType;')
				sourceText = sourceText.replace('import net.minecraft.client.renderer.rendertype.RenderTypes;', 'import net.minecraft.client.renderer.RenderType;')
					sourceText = sourceText.replace('RenderTypes.lines()', 'RenderType.lines()')
					sourceText = sourceText.replaceAll('public boolean mouseScrolled\\(double mouseX, double mouseY, double horizontalAmount, double verticalAmount\\)', 'public boolean mouseScrolled(double mouseX, double mouseY, double verticalAmount)')
					sourceText = sourceText.replace('super.mouseScrolled(mouseX, mouseY, horizontalAmount, verticalAmount)', 'super.mouseScrolled(mouseX, mouseY, verticalAmount)')
					sourceText = sourceText.replace('editor.mouseScrolled(mouseX, mouseY, horizontalAmount, verticalAmount)', 'editor.mouseScrolled(mouseX, mouseY, 0.0, verticalAmount)')
					sourceText = sourceText.replaceAll('public void renderBackground\\(GuiGraphics context, int mouseX, int mouseY, float delta\\)', 'public void renderBackground(GuiGraphics context)')
					sourceText = sourceText.replace('renderBackground(context, mouseX, mouseY, delta)', 'renderBackground(context)')
					sourceText = sourceText.replace('super.renderBackground(context, mouseX, mouseY, delta)', 'super.renderBackground(context)')
					sourceText = sourceText.replace('getRight()', 'getX() + getWidth()')
					sourceText = sourceText.replace('danmakuSettings.getX() + getWidth()', 'danmakuSettings.getX() + danmakuSettings.getWidth()')
					sourceText = sourceText.replace('ccSubtitle.getX() + getWidth()', 'ccSubtitle.getX() + ccSubtitle.getWidth()')
					sourceText = sourceText.replace('quality.getX() + getWidth()', 'quality.getX() + quality.getWidth()')
					sourceText = sourceText.replace('biliQuality.getX() + getWidth()', 'biliQuality.getX() + biliQuality.getWidth()')
					sourceText = sourceText.replace('youtubeQuality.getX() + getWidth()', 'youtubeQuality.getX() + youtubeQuality.getWidth()')
				def collectorMethods = '''
        @Override
        public void endVertex() {
        }

        @Override
        public void defaultColor(int red, int green, int blue, int alpha) {
        }

        @Override
        public void unsetDefaultColor() {
        }
'''
				sourceText = sourceText.replace('        public VertexConsumer normal(float x, float y, float z) {\n            return this;\n        }\n', '        public VertexConsumer normal(float x, float y, float z) {\n            return this;\n        }\n' + collectorMethods)
				def incompleteVertexCalls = sourceText.findAll('(?ms)^\\s*(?:consumer|buffer)\\.vertex\\([^;]+;')
					.findAll { !it.trim().endsWith('.endVertex();') }
				if (!incompleteVertexCalls.isEmpty()) {
					throw new GradleException("Missing endVertex() in generated 1.20.1 source: ${relativePath}")
				}
				def targetFile = new File(compatibilityClientSourceDir, relativePath)
				targetFile.parentFile.mkdirs()
				targetFile.setText(sourceText, 'UTF-8')
			}
		}
	}
}

loom {
	splitEnvironmentSourceSets()
	mods {
		videoplayer {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

sourceSets {
	main {
		java.setSrcDirs([compatibilityMainSourceDir, versionMainSourceDir])
		resources.setSrcDirs([rootProject.file('src/main/resources')])
	}
	client {
		java.setSrcDirs([compatibilityClientSourceDir, versionClientSourceDir])
	resources.setSrcDirs([file('src/client/resources'), rootProject.file('clients/fabric/1.21.1/src/client/resources'), rootProject.file('src/client/resources')])
	}
	test {
		java.setSrcDirs([rootProject.file('src/test/java')])
		resources.setSrcDirs([rootProject.file('src/test/resources')])
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${compatibilityMinecraft}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${compatibilityLoader}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${compatibilityFabric}"
	implementation 'net.java.dev.jna:jna:5.17.0'
	implementation 'org.brotli:dec:0.1.2'
	include 'org.brotli:dec:0.1.2'
	implementation 'com.google.zxing:core:3.5.3'
	include 'com.google.zxing:core:3.5.3'
	implementation project(':mcng-core')
	implementation project(path: compatibilityMcngProject, configuration: 'namedElements')
	shadowBundle project(':mcng-core')
	shadowBundle project(path: compatibilityMcngProject, configuration: 'namedElements')
	modCompileOnly "maven.modrinth:modmenu:${compatibilityModMenu}"
	modCompileOnly "maven.modrinth:vivecraft:${compatibilityVivecraft}"
	testImplementation platform('org.junit:junit-bom:5.11.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test { useJUnitPlatform() }

tasks.named('compileJava') { dependsOn generateCompatibilityMainSources }
tasks.named('compileClientJava') { dependsOn generateCompatibilityClientSources }
tasks.matching { it.name == 'sourcesJar' }.configureEach {
	dependsOn generateCompatibilityMainSources, generateCompatibilityClientSources
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

processResources {
	doFirst {
		java.nio.file.Files.deleteIfExists(destinationDir.toPath().resolve('assets/videoplayer/native/vlc/android_arm64-v8a.zip'))
		java.nio.file.Files.deleteIfExists(destinationDir.toPath().resolve('assets/videoplayer/native/vlc/android_arm64-v8a.NOTICE.txt'))
	}
	inputs.properties([
		version: project.version,
		loader_min_version: compatibilityLoader,
		minecraft_dependency: "~${compatibilityLane}",
		java_version: '21'
	])
	filesMatching('fabric.mod.json') { expand inputs.properties }
}

processClientResources {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(JavaCompile).configureEach { options.release = 21 }

tasks.withType(AbstractArchiveTask).configureEach {
	archiveVersion = "${project.version}-1.20.1"
}

java {
	toolchain { languageVersion = JavaLanguageVersion.of(21) }
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property 'archivesName', project.base.archivesName
	from(rootProject.file('LICENSE')) { rename { "${it}_${inputs.properties.archivesName}" } }
	from(rootProject.file('MCNG_LICENSE')) { rename { "${it}_${inputs.properties.archivesName}" } }
}

shadowJar {
	archiveClassifier = 'dev-shadow'
	configurations = [project.configurations.shadowBundle]
	from sourceSets.client.output
	from(rootProject.file('LICENSE')) { rename { "${it}_${project.base.archivesName.get()}" } }
	from(rootProject.file('MCNG_LICENSE')) { rename { "${it}_${project.base.archivesName.get()}" } }
	relocate 'com.github.squi2rel.mcng', 'com.github.squi2rel.vp.shadow.mcng'
}

remapJar {
	dependsOn shadowJar
	inputFile.set(shadowJar.archiveFile)
}

publishing {
	publications {
		create('mavenJava', MavenPublication) {
			artifactId = rootProject.archives_base_name
			from components.java
		}
	}
}
