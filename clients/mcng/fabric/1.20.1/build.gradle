plugins {
	id 'fabric-loom'
	id 'maven-publish'
}

base {
	archivesName = "${rootProject.archives_base_name}-fabric-client-1.20.1"
}

def compatibilitySourceDir = file("${buildDir}/generated/compatibility-source")
def generateCompatibilitySources = tasks.register('generateCompatibilitySources') {
	dependsOn project(':mcng-fabric-client-1.21.1').tasks.named('generateCompatibilitySources')
	def sourceRoot = rootProject.file('clients/mcng/fabric/1.21.1/build/generated/compatibility-source')
	inputs.dir(sourceRoot)
	outputs.dir(compatibilitySourceDir)
	doLast {
		project.delete(compatibilitySourceDir)
		fileTree(sourceRoot).matching { include '**/*.java' }.files.each { sourceFile ->
			def relativePath = sourceRoot.toPath().relativize(sourceFile.toPath()).toString().replace('\\', '/')
				def sourceText = sourceFile.getText('UTF-8').replace('ResourceLocation.fromNamespaceAndPath(', 'new ResourceLocation(')
				if (relativePath == 'com/github/squi2rel/mcng/fabric/client/MCNGDebugScreen.java') {
					sourceText = sourceText.replace('public boolean mouseScrolled(double mouseX, double mouseY, double horizontalAmount, double verticalAmount) {', 'public boolean mouseScrolled(double mouseX, double mouseY, double verticalAmount) {')
					sourceText = sourceText.replace('editor.mouseScrolled(mouseX, mouseY, horizontalAmount, verticalAmount) || super.mouseScrolled(mouseX, mouseY, horizontalAmount, verticalAmount)', 'editor.mouseScrolled(mouseX, mouseY, 0.0, verticalAmount) || super.mouseScrolled(mouseX, mouseY, verticalAmount)')
				}
			def targetFile = new File(compatibilitySourceDir, relativePath)
			targetFile.parentFile.mkdirs()
			targetFile.setText(sourceText, 'UTF-8')
		}
	}
}

sourceSets {
	main {
		java.setSrcDirs([compatibilitySourceDir])
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${rootProject.minecraft_1_20_1_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${rootProject.loader_1_20_1_version}"
	implementation project(':mcng-core')
	testImplementation platform('org.junit:junit-bom:5.11.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test { useJUnitPlatform() }

tasks.named('compileJava') { dependsOn generateCompatibilitySources }

tasks.withType(JavaCompile).configureEach { options.release = 21 }

java {
	toolchain { languageVersion = JavaLanguageVersion.of(21) }
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

publishing {
	publications {
		create('mavenJava', MavenPublication) {
			from components.java
			artifactId = "${rootProject.archives_base_name}-fabric-client-1.20.1"
		}
	}
}
