# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: verify release archives
        run: ./gradlew verifyRelease
      - name: capture all release archives
        uses: actions/upload-artifact@v4
        with:
          name: VideoPlayer-release
          path: build/release/*.jar
          if-no-files-found: error
      - name: capture Fabric 1.20.1 artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoPlayer-Fabric-1.20.1
          path: clients/fabric/1.20.1/build/libs/VideoPlayer-*-1.20.1.jar
          if-no-files-found: error
      - name: capture Fabric 1.20.4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoPlayer-Fabric-1.20.4
          path: clients/fabric/1.20.4/build/libs/VideoPlayer-*-1.20.4.jar
          if-no-files-found: error
      - name: capture Fabric 1.21.1 artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoPlayer-Fabric-1.21.1
          path: clients/fabric/1.21.1/build/libs/VideoPlayer-*-1.21.1.jar
          if-no-files-found: error
      - name: capture Fabric 1.21.11 artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoPlayer-Fabric-1.21.11
          path: |
            clients/fabric/1.21.11/build/libs/VideoPlayer-*.jar
            !clients/fabric/1.21.11/build/libs/*-sources.jar
            !clients/fabric/1.21.11/build/libs/*-dev-shadow.jar
          if-no-files-found: error
      - name: capture Fabric 26.2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoPlayer-Fabric-26.2
          path: |
            clients/fabric/26.2/build/libs/VideoPlayer-*-26.2.jar
            !clients/fabric/26.2/build/libs/*-plain.jar
            !clients/fabric/26.2/build/libs/*-sources.jar
          if-no-files-found: error
      - name: capture Paper 1.21.11 artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoPlayer-Paper-1.21.11
          path: |
            servers/paper/1.21.11/build/libs/VideoPlayer-Paper-*.jar
            !servers/paper/1.21.11/build/libs/*-plain.jar
          if-no-files-found: error
      - name: capture Paper 1.20.1 artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoPlayer-Paper-1.20.1
          path: |
            servers/paper/1.20.1/build/libs/VideoPlayer-Paper-*-1.20.1.jar
            !servers/paper/1.20.1/build/libs/*-plain.jar
          if-no-files-found: error
      - name: capture Paper 1.20.4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoPlayer-Paper-1.20.4
          path: |
            servers/paper/1.20.4/build/libs/VideoPlayer-Paper-*-1.20.4.jar
            !servers/paper/1.20.4/build/libs/*-plain.jar
          if-no-files-found: error
      - name: capture Paper 1.21.1 artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoPlayer-Paper-1.21.1
          path: |
            servers/paper/1.21.1/build/libs/VideoPlayer-Paper-*-1.21.1.jar
            !servers/paper/1.21.1/build/libs/*-plain.jar
          if-no-files-found: error
      - name: capture Fabric 26.1.2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoPlayer-Fabric-26.1.2
          path: clients/fabric/26.1.2/build/libs/VideoPlayer-*-26.1.2.jar
          if-no-files-found: error
      - name: capture Paper 26.1.2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoPlayer-Paper-26.1.2
          path: |
            servers/paper/26.1.2/build/libs/VideoPlayer-Paper-*-26.1.2.jar
            !servers/paper/26.1.2/build/libs/*-plain.jar
          if-no-files-found: error
      - name: capture Paper 26.2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoPlayer-Paper-26.2
          path: |
            servers/paper/26.2/build/libs/VideoPlayer-Paper-*-26.2.jar
            !servers/paper/26.2/build/libs/*-plain.jar
          if-no-files-found: error
