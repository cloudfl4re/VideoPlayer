name: VideoPlayer CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: videoplayer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Resolve build version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ "$version" == "$GITHUB_REF_NAME" ]]; then
              echo "Release tags must start with v" >&2
              exit 1
            fi
          else
            version="$(sed -n 's/^mod_version=//p' gradle.properties | head -n 1)"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid build version: $version" >&2
            exit 1
          fi

          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Build and verify release archives
        run: ./gradlew build verifyRelease --no-daemon -Pmod_version="${{ steps.version.outputs.value }}"

      - name: Upload Fabric 1.20.1 JAR
        uses: actions/upload-artifact@v7
        with:
          path: build/release/VideoPlayer-${{ steps.version.outputs.value }}-1.20.1.jar
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload Paper 1.20.1 JAR
        uses: actions/upload-artifact@v7
        with:
          path: build/release/VideoPlayer-Paper-${{ steps.version.outputs.value }}-1.20.1.jar
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload Fabric 1.20.4 JAR
        uses: actions/upload-artifact@v7
        with:
          path: build/release/VideoPlayer-${{ steps.version.outputs.value }}-1.20.4.jar
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload Paper 1.20.4 JAR
        uses: actions/upload-artifact@v7
        with:
          path: build/release/VideoPlayer-Paper-${{ steps.version.outputs.value }}-1.20.4.jar
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload Fabric 1.21.1 JAR
        uses: actions/upload-artifact@v7
        with:
          path: build/release/VideoPlayer-${{ steps.version.outputs.value }}-1.21.1.jar
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload Paper 1.21.1 JAR
        uses: actions/upload-artifact@v7
        with:
          path: build/release/VideoPlayer-Paper-${{ steps.version.outputs.value }}-1.21.1.jar
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload Fabric 1.21.11 JAR
        uses: actions/upload-artifact@v7
        with:
          path: build/release/VideoPlayer-${{ steps.version.outputs.value }}-1.21.11.jar
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload Paper 1.21.11 JAR
        uses: actions/upload-artifact@v7
        with:
          path: build/release/VideoPlayer-Paper-${{ steps.version.outputs.value }}-1.21.11.jar
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload Fabric 26.1.2 JAR
        uses: actions/upload-artifact@v7
        with:
          path: build/release/VideoPlayer-${{ steps.version.outputs.value }}-26.1.2.jar
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload Paper 26.1.2 JAR
        uses: actions/upload-artifact@v7
        with:
          path: build/release/VideoPlayer-Paper-${{ steps.version.outputs.value }}-26.1.2.jar
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload Fabric 26.2 JAR
        uses: actions/upload-artifact@v7
        with:
          path: build/release/VideoPlayer-${{ steps.version.outputs.value }}-26.2.jar
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload Paper 26.2 JAR
        uses: actions/upload-artifact@v7
        with:
          path: build/release/VideoPlayer-Paper-${{ steps.version.outputs.value }}-26.2.jar
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: VideoPlayer-test-reports
          path: |
            **/build/test-results/**
            **/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 7
